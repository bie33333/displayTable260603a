        // ============ 从编辑器加载数据 ============
        function loadSavedData() {
            const saved = localStorage.getItem('skincare_products');
            if (saved) {
                try { return JSON.parse(saved); } catch(e) {}
            }
            return JSON.parse(JSON.stringify(defaultProducts));
        }
        const products = loadSavedData();

        // ============ 加载全局设置 ============
        function loadSettings() {
            const saved = localStorage.getItem('skincare_settings');
            if (saved) {
                try {
                    const s = JSON.parse(saved);
                    document.querySelector('.header-title').textContent = s.globalTitle || '护肤臻品图册';
                    document.querySelector('.header-subtitle').textContent = s.globalSubtitle || 'SKINCARE COLLECTION';
                    document.querySelector('.cover-title').textContent = s.coverTitle || '臻选护肤好物';
                    document.querySelector('.cover-desc').textContent = s.coverDesc || '用心甄选 · 呵护每一寸肌肤';
                    document.querySelector('.cover-badge').textContent = s.coverBadge || 'HOT RECOMMEND';
                    document.title = s.globalTitle || '护肤臻品图册';
                    // 更新微信咨询
                    window._wechatId = s.wechatId || 'XXX_WeChat';
                } catch(e) {}
            }
        }
        loadSettings();

        // ============ 渲染产品列表 ============
        const productGrid = document.getElementById('productGrid');
        let currentProduct = null;
        let cart = [];
        let liked = false;

        function renderProducts() {
            // 找到featured产品
            const featured = products.filter(p => p.featured);
            const normal = products.filter(p => !p.featured);

            let html = '';

            // 渲染featured产品
            featured.forEach(p => {
                html += `
                <div class="product-card featured" onclick="openDetail(${p.id})">
                    <div class="product-img-wrap">
                        <img class="product-img" src="${p.img}" alt="${p.name}" loading="lazy">
                        <span class="product-tag ${p.tagClass}">${p.tag}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-brief">${p.brief}</div>
                        <div class="product-bottom">
                            <span class="product-price"><span class="unit">¥</span>${p.price}<span class="original">¥${p.originalPrice}</span></span>
                            <button class="product-action" onclick="event.stopPropagation(); quickAdd(${p.id})">+ 加入清单</button>
                        </div>
                    </div>
                </div>`;
            });

            // 分类标题
            if (normal.length > 0) {
                html += `<div class="section-title" style="grid-column: span 2;">
                    <span class="section-title-line"></span>
                    <span class="section-title-text">更多臻选好物</span>
                    <span class="section-title-line"></span>
                </div>`;
            }

            // 渲染普通产品
            normal.forEach(p => {
                html += `
                <div class="product-card" onclick="openDetail(${p.id})">
                    <div class="product-img-wrap">
                        <img class="product-img" src="${p.img}" alt="${p.name}" loading="lazy">
                        <span class="product-tag ${p.tagClass}">${p.tag}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-brief">${p.brief}</div>
                        <div class="product-bottom">
                            <span class="product-price"><span class="unit">¥</span>${p.price}<span class="original">¥${p.originalPrice}</span></span>
                            <button class="product-action" onclick="event.stopPropagation(); quickAdd(${p.id})">+ 清单</button>
                        </div>
                    </div>
                </div>`;
            });

            productGrid.innerHTML = html;
        }

        // ============ 产品详情弹窗 ============
        function openDetail(id) {
            currentProduct = products.find(p => p.id === id);
            if (!currentProduct) return;

            document.getElementById('modalImg').src = currentProduct.img;
            document.getElementById('modalName').textContent = currentProduct.name;
            document.getElementById('modalDesc').textContent = currentProduct.desc;
            document.getElementById('modalPrice').innerHTML = `<span class="unit">¥</span>${currentProduct.price}`;

            const tagsHtml = currentProduct.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');
            document.getElementById('modalTags').innerHTML = tagsHtml;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (event && event.target !== document.getElementById('modalOverlay')) return;
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
            currentProduct = null;
        }

        // ============ 加入清单 ============
        function addToCart() {
            if (!currentProduct) return;
            quickAdd(currentProduct.id);
            closeModal();
        }

        function quickAdd(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            updateCartBadge();
            showToast(`已添加「${product.name}」`);
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            if (total > 0) {
                badge.style.display = 'flex';
                badge.textContent = total;
            } else {
                badge.style.display = 'none';
            }
        }

        function showCart() {
            if (cart.length === 0) {
                showToast('清单为空，快去挑选吧~');
                return;
            }

            let msg = '📋 我的选购清单：\n\n';
            let totalPrice = 0;
            cart.forEach((item, i) => {
                msg += `${i + 1}. ${item.name}  ×${item.qty}  ¥${item.price * item.qty}\n`;
                totalPrice += parseFloat(item.price) * item.qty;
            });
            msg += `\n💰 合计：¥${totalPrice.toFixed(0)}`;
            msg += '\n\n请截图发送给我，立即下单！';

            alert(msg);
        }

        // ============ 咨询 ============
        function consultNow() {
            const msg = cart.length > 0
                ? '您好，我想咨询产品详情和下单事宜～'
                : '您好，我想了解护肤产品～';
            // 这里可以替换为你的微信号或企微链接
            const wechatId = window._wechatId || 'XXX_WeChat';
            showToast('请添加微信咨询：' + wechatId);
            // 如果是微信环境，可以尝试唤起微信客服
            // window.location.href = 'weixin://dl/chat?xxx';
        }

        // ============ 收藏 ============
        function toggleLike() {
            liked = !liked;
            const btn = document.getElementById('likeBtn');
            if (liked) {
                btn.textContent = '❤️';
                btn.classList.add('heart-anim');
                setTimeout(() => btn.classList.remove('heart-anim'), 600);
                showToast('已收藏 💖');
            } else {
                btn.textContent = '🤍';
                showToast('已取消收藏');
            }
        }

        // ============ 分享 ============
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: '护肤臻品图册',
                    text: '发现超棒的护肤好物，快来一起变美吧～',
                    url: window.location.href
                }).catch(() => {});
            } else {
                const input = document.createElement('input');
                input.value = window.location.href;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('链接已复制，快去分享吧~');
            }
        }

        // ============ Toast ============
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        // ============ 键盘事件 ============
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ============ 初始化 ============
        renderProducts();
    </script>
</body>
</html>
